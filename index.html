<!DOCTYPE html>
<html lang="en">

<!-- HEADER -->
<head>
<!-- Use UTF-8 character encoding (standard) -->
<meta charset="UTF-8" />
<!-- Scale the size of the page according to screen size -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

<title>uome</title>
<!-- Declare this an installable PWA -->
<link rel="manifest" href="manifest.json" />
<!-- Set browser theme colour, i.e. the colour of the surrounding UI, not the web page itself -->
<meta name="theme-color" content="#121212" />
<!-- Declare icons -->
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />

<!-- Configure iOS home screen icon behaviour -->
<!-- Run in full-screen standalone -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<!-- Configure status bar behaviour (the black status bar at the top of the screen) -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<!-- Set the name of the app on the home screen -->
<meta name="apple-mobile-web-app-title" content="uome" />
<!-- General, non-iOS behaviour -->
<meta name="mobile-web-app-capable" content="yes" />

<!-- Load fancy font families (Fraunces, IBM Plex Mono, and Inter) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;0,700;1,500&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<!-- Define the document style with classes. This controls e.g. backgrounds and allows for defining of custom objects. -->
<style>
    /* Standard colours */
    :root {
        --black: #121212; /* Bottom background */
        --white: #FFFDF7; /* Text on bottom background */
        --light-grey: #E0E0E0; /* Contrast with white text */
        --muted-grey: #9A9280; /* Zero balances */
        --bottom-button: #8FA69C; /* Button on bottom background */
        --cream: #F7F3E8; /* App content background */
        --dark-cream: #E6DFCB; /* Demarcation lines */
        --darker-cream: #B7AD91; /* Settle up boxes */
        --input-box: #D8CFB8; /* Input boxes */
        --red: #A63D2F; /* Delete buttons */
    }

    * { box-sizing: border-box; }
    /* Remove default margins and padding */
    html, body { margin: 0; padding: 0; }
    /* Document body, e.g. background colour */
    body { min-height: 100vh; background: var(--black); font-family: 'Inter', sans-serif; color: var(--white); }
    /* Define a box which can vary in width. For displays less than 480px, fills up the screen. This is where all info will be displayed. */
    .app { width: 100%; color:var(--black); max-width: 480px; margin: 0 auto; min-height: 100vh; background: var(--cream); display: flex; flex-direction:column; position: relative; }
    /* Header. Padding accounts for extra intrusions (e.g. status bar) */
    .stamp-header { background: var(--black); padding: calc(18px + env(safe-area-inset-top)) 20px 18px; position: relative; flex-shrink: 0; }
    
    /* App branding in header */
    /* brand-row handles alignment of elements in the header */
    .brand-row { display: flex; align-items: center; justify-content: space-between; }
    .brand { font-family: 'Fraunces', serif; font-weight: 700; font-style: italic; color: var(--white); font-size: 24px; margin: 0; }
    .brand-sub { font-family: 'IBM Plex Mono', monospace; color: var(--light-grey); font-size: 10.5px; letter-spacing: 1.5px; text-transform: uppercase; margin-top: 4px; }
    /* Sync status */
    .sync-pill { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--bottom-button); background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); padding: 5px 10px; border-radius: 12px; cursor: pointer; white-space: nowrap; }
    .sync-pill.live { color: var(--light-grey); border-color: var(--light-grey); }

    /* Demarcates the content display with ruled lines */
    .content { flex: 1; overflow-y: auto; padding: 22px 18px 100px; background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 38px, var(--dark-cream) 39px); }

    /* Format titles of sections, e.g. "Expenses", and format an 'add' (+) button. */
    .section-title { font-family: 'Fraunces', serif; font-size: 19px; font-weight: 600; margin: 0 0 14px; display: flex; align-items: center; justify-content: space-between; }
    .add-btn { font-family: 'IBM Plex Mono', monospace; font-size: 12px; background: var(--black); color: var(--cream); border: none; padding: 7px 12px; border-radius: 3px; cursor: pointer; letter-spacing: 0.5px; }

    /* Format each expense as a row in content */
    .expense-row { background: var(--white); border: 1px solid var(--dark-cream); border-left: 3px solid var(--black); border-radius: 4px; padding: 12px 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    /* With a description */
    .expense-desc { font-weight: 600; font-size: 14.5px; margin: 0 0 4px; }
    .expense-meta { font-size: 12px; color: var(--muted-grey); font-family: 'IBM Plex Mono', monospace; }
    /* And an amount */
    .expense-amount { font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 15px; white-space: nowrap; }
    /* And an option to remove the row */
    .del-x { background: none; border: none; color: var(--red); font-size: 16px; cursor: pointer; line-height: 1; padding: 2px 4px; opacity: 0.55; }
    /* And sum these up to provide a balance */
    .balance-card { display: flex; align-items: center; justify-content: space-between; background: var(--white); border: 1px solid var(--dark-cream); border-radius: 6px; padding: 13px 14px; margin-bottom: 10px; }

    /* Avatars for users, i.e. just an initial in a circle */
    .avatar { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--cream); font-weight: 600; font-size: 13px; font-family: 'Fraunces', serif; flex-shrink: 0; }
    /* Align that with the name corresponding to the avatar */
    .who { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 14.5px; }
    
    /* Format balances: positive, negative, and zero */
    .bal-amt { font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 14.5px; }
    .pos { color: var(--black); } .neg { color: var(--red); } .zero { color: #9A9280; }

    /* Format settle up: how much does each person owe? */
    /* Overall container */
    .receipt { background: var(--white); border: 1px dashed var(--darker-cream); border-radius: 4px; padding: 14px 16px; margin-top: 4px; }
    /* Individual rows */
    .settle-row{ display: flex; align-items: center; gap: 8px; font-family: 'IBM Plex Mono', monospace; font-size: 13.5px; padding: 8px 0; border-bottom: 1px dashed var(--dark-cream)}
    .settle-row:last-child { border-bottom: none; }
    .arrow { color: var(--light-grey); font-weight: 600; }
    .settle-amt { margin-left: auto; font-weight: 600; }

    /* Empty state */
    .empty { text-align: center; color: var(--muted-grey); font-size: 13px; padding: 30px 10px; font-style: italic; }

    /* Format tab bar and buttons */
    .tabbar { position: fixed; bottom: 0; left: 0; right: 0; max-width: 480px; margin: 0 auto; background: var(--black); display: flex; padding: 10px 8px calc(10px + env(safe-area-inset-bottom)); }
    .tab-btn { flex: 1; background: none; border: none; cursor: pointer; padding: 8px 4px; color: var(--bottom-button); font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 1px; text-transform: uppercase; border-bottom: 2px solid transparent; }
    .tab-btn.active { color: var(--white); border-bottom-color: var(--light-grey); }

    /* Format modal pop-ups */
    .modal-overlay { position: fixed; inset: 0; background: rgba(27,36,32,0.55); display: flex; align-items: flex-end; z-index: 10; }
    .modal-overlay.center { align-items: center; padding: 20px; }
    .modal { background: var(--cream); width: 100%; max-width: 480px; margin: 0 auto; border-radius: 20px 20px 0 0; padding: 20px 20px calc(20px + env(safe-area-inset-bottom)); max-height: 88vh; overflow-y: auto; }
    .modal.card { border-radius: 16px; }
    .modal h3 { font-family: 'Fraunces', serif; color: var(--black); margin: 0 0 8px; font-size: 20px; }
    .modal p.lead { font-size: 13.5px; color: #6B6355; margin: 0 0 18px; line-height: 1.5; }

    /* Format input boxes */
    label.field { display: block; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: #6B6355; font-family: 'IBM Plex Mono', monospace; margin: 14px 0 6px; }
    input[type=text], input[type=number], select { width: 100%; padding: 10px 12px; border: 1px solid var(--input-box); border-radius: 5px; background: var(--white); font-family: 'Inter', sans-serif; font-size: 14.5px; color: var(--black) }
    /* Format selection boxes e.g. for selecting who took part in a transaction */
    .chip-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
    .chip { padding: 7px 12px; border-radius: 16px; border: 1px solid var(--input-box); background: var(--white); font-size: 13px; cursor: pointer; font-weight: 500; }
    .chip.on { background: var(--black); color: var(--cream); border-color: var(--black); }
    /* Save/cancel buttons in input boxes */
    .btn-primary, .btn-ghost { flex: 1; padding: 12px; border-radius: 6px; font-weight: 600; font-size: 14px; cursor: pointer; border: none; font-family: 'Inter', sans-serif; }
    .btn-primary { background: var(--black); color: var(--white); }
    .btn-ghost { background: transparent; color: #6B6355; border: 1px solid var(--input-box); }

    /* Format friends in rows, option to add a friend */
    .friend-row { display: flex; align-items: center; justify-content: space-between; background: var(--white); border: 1px solid var(--dark-cream); border-radius: 6px; padding: 11px 13px; margin-bottom: 9px; }
    .add-friend-row { display: flex; gap: 8px; margin-bottom: 16px; }
    .add-friend-row input { flex: 1; }

    /* Display active code */
    .code-display { font-family: 'IBM Plex Mono', monospace; font-size: 28px; font-weight: 600; letter-spacing: 4px; text-align: center; background: var(--white); border: 1px dashed var(--darker-cream); border-radius: 6px; padding: 16px; margin: 14px 0; color: var(--black); }
    .or-divider { text-align: center; color: var(--muted-grey); font-size: 11px; letter-spacing: 1px; text-transform: uppercase; font-family: 'IBM Plex Mono', monospace; margin: 20px 0; }

    /* Welcome menu/gate: Join or create a group */
    .gate-btn { width: 100%; padding: 13px; border-radius: 6px; font-weight: 600; font-size: 14.5px; cursor: pointer; border: none; margin-bottom: 10px; }
    .gate-btn.primary { background: var(--black); color: var(--white); }
    .gate-btn.outline { background: transparent; border: 1px solid var(--input-box); color: var(--black); }

    /* Misconfiguration warning */
    .config-warning { background: #FCEFE9; border: 1px solid #E3B7A5; color: #7A3421; font-size: 12.5px; padding: 12px 14px; border-radius: 6px; margin-bottom: 16px; line-height: 1.5; }
    .config-warning code { background: rgba(0,0,0,0.06); padding: 1px 4px; border-radius: 3px; }
</style>
</head>

<body>
<!-- Place an app box -->
<div class="app">
    <!-- Add header with branding and sync status -->
    <div class="stamp-header">
        <div class="brand-row">
            <!-- branding -->
            <div>
            <p class="brand">uome</p>
            <div class="brand-sub" id="brandSub">shared expenses</div>
            </div>
            <!-- sync status -->
            <button class="sync-pill" id ="syncPill" onclick="openGroupInfo()">not synced</button>
        </div>
    </div>
    <!-- Content -->
    <div class="content" id="content"></div>
    <!-- Tab bars -->
    <div class="tabbar">
        <button class="tab-btn" data-tab="transactions">Transactions</button>
        <button class="tab-btn" data-tab="balances">Balances</button>
        <button class="tab-btn" data-tab="friends">Friends</button>
    </div>
</div>
<!-- Create a modal and welcome gate for scripts to latch onto -->
<div id="modalRoot"></div>
<div id="gateRoot"></div>

<!-- JavaScript: The real engine of the web app -->
<script>
/* =========================================================
   FIREBASE CONFIG :
   (Firebase console → Project settings → your web app → Config)
   ========================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyBQdz0hZef0ZGdXv1odP_Ok4jLWuNTqHjk",
  authDomain: "uomi-e5b53.firebaseapp.com",
  projectId: "uomi-e5b53",
  storageBucket: "uomi-e5b53.firebasestorage.app",
  messagingSenderId: "322746050646",
  appId: "1:322746050646:web:ed23d246982e7e1286f3f7",
};
const CONFIG_IS_PLACEHOLDER = firebaseConfig.apiKey === "YOUR_API_KEY";

// Initialise group ID
const LOCAL_GROUP_KEY = "uome-group-id";
// Colour palette for avatar backgrounds
// Black, light grey, red, blue, brown 
const PALETTE = ["#212121", "#E0E0E0", "#A63D2F", "#3D5A80", "#6B4226"];
// Convert a name into a colour based on character values (pseudo-random)
const hashColour = (name) => {
    let h = 0;
    for (let i = 0; i < name.length; i++) {
        h = name.charCodeAt(i) + ((h << 5) - h); // ((h << 5) - h ) = h*31
    }
    return PALETTE[Math.abs(h) % PALETTE.length];
};
// Round and format a number n as currency (postive definite)
const money = (n) => `£${Math.abs(n).toFixed(2)}`;
// Generate pseudo-random user ID
const uid = () => Math.random().toString(36).slice(2,9);
// Generate a pseudo-random group code
const genGroupCode = () => Math.random().toString(36).slice(2,8).toUpperCase();
// HTML-escaping on input strings
function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }

// Initialise database, grab group ID from locals, unsubscription from Firebase
let db = null;
let groupId = localStorage.getItem(LOCAL_GROUP_KEY) || null;
let unsubscribe = null;

// Initial state
let state = {
    friends: ["John"],
    expenses: [],
    tab: "transactions",
}

// --- FIREBASE CONNECTORS --- //
function initFirebase() {
    // Fail initialisation if config not setup
    if (CONFIG_IS_PLACEHOLDER) return false;
    try {
        firebase.initializeApp(firebaseConfig);
        db = firebase.firestore();
        db.enablePersistence({ synchronizeTabs: true }).catch(() => {});
        return true;
    } catch (e) {
        console.error("Firebase init failed! Caught:", e);
        return false;
    }
}

// Update sync pill
function setSyncPill(mode) {
    const pill = document.getElementById("syncPill");
    if (mode === "live") { pill.textContent = groupId; pill.classList.add("live"); }
    else if (mode === "connecting") { pill.textContent = "connecting…"; pill.classList.remove("live")}
    else { pill.textContent = "not synced"; pill.classList.remove("live"); }
}

// Subscribe to a group by ID
function subscribeToGroup(id) {
    // Detach any old listeners
    if (unsubscribe) unsubscribe();
    setSyncPill("connecting");
    // Grab data from Firebase database @ group ID
    unsubscribe = db.collection("groups").doc(id).onSnapshot((doc) => {
        if (doc.exists) {
            const data = doc.data();
            state.friends = data.friends || [];
            state.expenses = data.expenses || [];
        }
        setSyncPill("live");
        render();
    }, (err) => {
        console.error("Sync error! Caught", err);
        setSyncPill("not synced");
    })
}

// Push local changes to Firebase
async function pushState() {
    if (!db || !groupId) return;
    await db.collection("groups").doc(groupId).set({
        friends: state.friends,
        expenses: state.expenses,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
    }, { merge: true });
}

// Create a group with default field values
// Makes group ID persistent and closes welcome message/gate
async function createGroup() {
    const id = genGroupCode();
    await db.collection("groups").doc(id).set({
        friends: ["John"],
        expenses: [],
        updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
    });
    groupId = id;
    localStorage.setItem(LOCAL_GROUP_KEY, id);
    subscribeToGroup(id);
    closeGate();
}

// Join an existing group
async function joinGroup(code) {
    const id = code.trim().toUpperCase();
    if (!id) return;
    const docRef = db.collection("groups").doc(id);
    const snap = await docRef.get();
    if (!snap.exists) {
        document.getElementById("joinError").textContent = "Group not found.";
        return;
    }
    groupId = id;
    localStorage.setItem(LOCAL_GROUP_KEY, id);
    // Grab app data from group
    subscribeToGroup(id);
    closeGate();
}

// Leave active group
function leaveGroup() {
    if (unsubscribe) unsubscribe();
    groupId = null;
    localStorage.removeItem(LOCAL_GROUP_KEY);
    state = { friends: ["John"], expenses: [], tab: "transactions"};
    setSyncPill("not synced");
    render();
    showGate();
}

// --- GATE HANDLING (WELCOME SCREEN) --- //
function showGate() {
    // Hook onto the gateRoot element and insert a modal box with 
    // group code input
    if (CONFIG_IS_PLACEHOLDER) {
    document.getElementById("gateRoot").innerHTML = `
      <div class="modal-overlay center">
        <div class="modal card">
          <h3>Sync isn't set up yet</h3>
          <div class="config-warning">
            This copy of the app doesn't have a Firebase project connected, so it's running local-only on this device.
            Add your Firebase config in <code>index.html</code> (look for <code>firebaseConfig</code>) to enable sync across devices.
          </div>
          <div class="modal-actions">
            <button class="btn-primary" style="flex:1" onclick="closeGate()">Continue without sync</button>
          </div>
        </div>
      </div>`;
    return;
    }
    document.getElementById("gateRoot").innerHTML = `
    <div class="modal-overlay center">
      <div class="modal card">
        <h3>Synchronise transactions</h3>
        <p class="lead">Create a group and share the code, or join an existing group.</p>
        <button class="gate-btn primary" onclick="createGroup()">Create a new group</button>
        <div class="or-divider">or</div>
        <input type="text" id="joinCodeInput" placeholder="Enter group code" style="text-transform:uppercase;text-align:center;letter-spacing:2px;font-family:'IBM Plex Mono',monospace;" />
        <div id="joinError" style="color:#A63D2F;font-size:12px;margin-top:6px;min-height:14px;"></div>
        <button class="gate-btn outline" style="margin-top:10px;" onclick="joinGroup(document.getElementById('joinCodeInput').value)">Join group</button>
      </div>
    </div>`;
}
function closeGate() { document.getElementById("gateRoot").innerHTML = ""; }

// Expand group code or leave current group
function openGroupInfo() {
  if (!groupId) { showGate(); return; }
  document.getElementById("modalRoot").innerHTML = `
    <div class="modal-overlay center" onclick="if(event.target===this) closeModal()">
      <div class="modal card">
        <h3>This group's code</h3>
        <p class="lead">Share this code with friends so their app syncs with yours in real time.</p>
        <div class="code-display">${esc(groupId)}</div>
        <div class="modal-actions">
          <button class="btn-ghost" onclick="leaveGroup(); closeModal();">Leave group</button>
          <button class="btn-primary" onclick="closeModal()">Done</button>
        </div>
      </div>
    </div>`;
}

// ---  ACCOUNTING --- //
function computeBalances() {
    // Initialise a lookup with friend name and balance
    const bal = Object.fromEntries(state.friends.map((f) => [f, 0]));
    // Loop through expenses
    state.expenses.forEach((e) => {
        // Calculate the share for each expenses, i.e. expense / no. of sharers
        const share = e.amount / e.split.length;
        // Subtract the share from every sharers balance
        e.split.forEach((p) => {
            if (bal[p] !== undefined ) bal[p] -= share;
        });
        // Add the total expense to the payer
        // The net effect is that they are owed everything but their own share
        if (bal[e.paidBy] !== undefined ) bal[e.paidBy] += e.amount;
    });
    return bal
}

// Organise friends by debtors and creditors, with balances
// Recommend settle up transactions
function simplifyDebts(balances) {
    const creditors = [], debtors = [];
    // Loop over (name, amt) pairs in balances lookup table
    Object.entries(balances).forEach(([name, amt]) => {
        if (amt > 0.01) creditors.push({ name, amt });
        else if (amt < -0.01) debtors.push({ name, amt: -amt});
    });
    // Sort in descending order
    creditors.sort((a, b) => b.amt - a.amt);
    debtors.sort((a, b) => b.amt - a.amt);
    const txns = [];
    let i = 0, j = 0;
    // Calculate individual settle up transactions
    while (i < debtors.length && j < creditors.length) {
        const pay = Math.min(debtors[i].amt, creditors[j].amt);
        txns.push({ from: debtors[i].name, to: creditors[j].name, amount: pay});
        debtors[i].amt -= pay; creditors[j].amt -= pay;
        if (debtors[i].amt < 0.01) i++;
        if (creditors[j].amt < 0.01) j++;
    }
    return txns;
}

// --- RENDERING --- //
// Render expenses as rows
function renderTransactions() {
    const rows = state.expenses.map((e) => `
        <div class="expense-row">
        <div>
            <p class="expense-desc">${esc(e.desc)}</p>
            <div class="expense-meta">${esc(e.paidBy)} paid · split ${e.split.length} ways</div>
        </div>
        <div style="display:flex;align-items:center;gap:6px;">
            <span class="expense-amount">${money(e.amount)}</span>
            <button class="del-x" onclick="removeExpense('${e.id}')" aria-label="Delete expense">✕</button>
        </div>
        </div>`).join("");
    return `
        <div class="section-title">Transactions <button class="add-btn" onclick="openAddModal()">+ Add</button></div>
        ${state.expenses.length === 0 ? '<div class="empty">No transactions yet.</div>' : rows}
    `;
}

// Render expenses and settle ups
function renderBalances() {
    const balances = computeBalances();
    const cards = state.friends.map((f) => {
        const b = balances[f] || 0;
        const cls = b > 0.01 ? "pos" : b < -0.01 ? "neg" : "zero";
        const label = b > 0.01 ? `is owed ${money(b)}` : b < -0.01 ? `owes ${money(b)}` : "settled up";
        return `
        <div class="balance-card">
            <div class="who"><div class="avatar" style="background:${hashColour(f)}">${esc(f.slice(0,2).toUpperCase())}</div>${esc(f)}</div>
            <div class="bal-amt ${cls}">${label}</div>
        </div>`;
    }).join("");
    const settlements = simplifyDebts(balances);
    const settleRows = settlements.map((t) => `
        <div class="settle-row">${esc(t.from)} <span class="arrow">→</span> ${esc(t.to)} <span class="settle-amt">${money(t.amount)}</span></div>
    `).join("");
    return `
        <div class="section-title">Balances</div>
        ${cards}
        <div class="section-title" style="margin-top:22px;">Settle up</div>
        <div class="receipt">${settlements.length === 0 ? "<div class=\"empty\">Everyone's even — nothing to settle.</div>" : settleRows}</div>
    `;
}

// Render friends
function renderFriends() {
    const rows = state.friends.map((f) => `
        <div class="friend-row">
        <div class="who"><div class="avatar" style="background:${hashColour(f)}">${esc(f.slice(0,2).toUpperCase())}</div>${esc(f)}</div>
        <button class="del-x" onclick="removeFriend('${esc(f)}')" aria-label="Remove friend">✕</button>
        </div>`).join("");
    return `
        <div class="section-title">Friends</div>
        <div class="add-friend-row">
        <input type="text" id="newFriendInput" placeholder="Add a friend's name" onkeydown="if(event.key==='Enter') addFriend()" />
        <button class="add-btn" onclick="addFriend()">Add</button>
        </div>
        ${rows}
    `;
}

// Render app content based on tab state
function render() {
    document.getElementById("brandSub").textContent = `shared expenses · ${state.friends.length} friends`;
    const content = document.getElementById("content");
    if (state.tab === "transactions") content.innerHTML = renderTransactions();
    else if (state.tab === "balances") content.innerHTML = renderBalances();
    else content.innerHTML = renderFriends();
    document.querySelectorAll(".tab-btn").forEach((btn) => btn.classList.toggle("active", btn.dataset.tab === state.tab));
}

// Listen for clicks to tab buttons and re-render content
document.querySelectorAll(".tab-btn").forEach((btn) => {
     btn.addEventListener("click", () => { state.tab = btn.dataset.tab; render(); });
});

// --- REWRITE FIRESTORE AND RE-RENDER --- //
function removeExpense(id) {
    state.expenses = state.expenses.filter((e) => e.id !== id);
    db ? pushState() : render();
}

function addFriend() {
    const input = document.getElementById("newFriendInput");
    const n = input.value.trim();
    if (!n || state.friends.includes(n)) return;
    state.friends.push(n);
    db ? pushState() : render();
}
function removeFriend(name) {
    state.friends = state.friends.filter((x) => x !== name);
    state.expenses = state.expenses.filter((e) => e.paidBy !== name && !e.split.includes(name));
    db ? pushState() : render();
}

// Adding transactions
let formState = { desc: "", amount: "", paidBy: "", split: [] };
function openAddModal() {
    formState = { desc: "", amount: "", paidBy: state.friends[0] || "", split: [...state.friends] };
    renderModal();
}
function closeModal() { document.getElementById("modalRoot").innerHTML = ""; }
// Toggle splitters
function toggleSplit(name) {
    formState.split = formState.split.includes(name) ? formState.split.filter((n) => n !== name) : [...formState.split, name];
    renderModal(true);
}
// Get transaction input
function submitTransaction() {
    const desc = document.getElementById("descInput").value.trim();
    const amount = parseFloat(document.getElementById("amountInput").value);
    const paidBy = document.getElementById("paidBySelect").value;
    if (!desc || !amount || amount <= 0 || formState.split.length === 0) return;
    state.expenses.unshift({ id: uid(), desc, amount, paidBy, split: formState.split });
    closeModal();
    db ? pushState() : render();
}
function renderModal(preserveInputs) {
    const desc = preserveInputs ? document.getElementById("descInput").value : formState.desc;
    const amount = preserveInputs ? document.getElementById("amountInput").value : formState.amount;
    const paidBy = preserveInputs ? document.getElementById("paidBySelect").value : formState.paidBy;
    const chips = state.friends.map((f) => `<button type="button" class="chip ${formState.split.includes(f) ? "on" : ""}" onclick="toggleSplit('${esc(f)}')">${esc(f)}</button>`).join("");
    const options = state.friends.map((f) => `<option value="${esc(f)}" ${f === paidBy ? "selected" : ""}>${esc(f)}</option>`).join("");
    document.getElementById("modalRoot").innerHTML = `
        <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
        <div class="modal">
            <h3>New transaction</h3>
            <label class="field">Description</label>
            <input type="text" id="descInput" placeholder="e.g. Taxi home" value="${esc(desc)}" />
            <label class="field">Amount</label>
            <input type="number" id="amountInput" placeholder="0.00" value="${esc(amount)}" />
            <label class="field">Paid by</label>
            <select id="paidBySelect">${options}</select>
            <label class="field">Split among</label>
            <div class="chip-row">${chips}</div>
            <div class="modal-actions">
            <button class="btn-ghost" onclick="closeModal()">Cancel</button>
            <button class="btn-primary" onclick="submitTransaction()">Save transaction</button>
            </div>
        </div>
        </div>`;
}

// --- BOOT --- //
render();
const hasFirebase = initFirebase();
if (hasFirebase && groupId) {
    subscribeToGroup(groupId);
} else {
    showGate();
}

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
</body>
</html>
