<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>uome</title>

<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#121212" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Ledger" />
<meta name="mobile-web-app-capable" content="yes" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;0,700;1,500&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- Firebase (compat SDK — no build step needed) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { min-height: 100vh; background: #121212; font-family: 'Inter', sans-serif; color: #121212; }
  .app { width: 100%; max-width: 480px; margin: 0 auto; min-height: 100vh; background: #F7F3E8; display: flex; flex-direction: column; position: relative; }
  .stamp-header { background: #121212; padding: calc(18px + env(safe-area-inset-top)) 20px 18px; position: relative; flex-shrink: 0; }
  .stamp-header::after { content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 10px;
    background: radial-gradient(circle at 8px 0, transparent 8px, #121212 8.5px) repeat-x; background-size: 16px 16px; }
  .brand-row { display: flex; align-items: center; justify-content: space-between; }
  .brand { font-family: 'Fraunces', serif; font-weight: 700; font-style: italic; color: #F7F3E8; font-size: 24px; margin: 0; }
  .brand-sub { font-family: 'IBM Plex Mono', monospace; color: #E0E0E0; font-size: 10.5px; letter-spacing: 1.5px; text-transform: uppercase; margin-top: 4px; }
  .sync-pill { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #8FA69C; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); padding: 5px 10px; border-radius: 12px; cursor: pointer; white-space: nowrap; }
  .sync-pill.live { color: #E0E0E0; border-color: #E0E0E0; }
  .content { flex: 1; overflow-y: auto; padding: 22px 18px 100px;
    background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 38px, #E6DFCB 39px); }
  .section-title { font-family: 'Fraunces', serif; font-size: 19px; font-weight: 600; margin: 0 0 14px; display: flex; align-items: center; justify-content: space-between; }
  .add-btn { font-family: 'IBM Plex Mono', monospace; font-size: 12px; background: #212121; color: #F7F3E8; border: none; padding: 7px 12px; border-radius: 3px; cursor: pointer; letter-spacing: 0.5px; }
  .expense-row { background: #FFFDF7; border: 1px solid #E6DFCB; border-left: 3px solid #212121; border-radius: 4px; padding: 12px 13px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .expense-desc { font-weight: 600; font-size: 14.5px; margin: 0 0 4px; }
  .expense-meta { font-size: 12px; color: #6B6355; font-family: 'IBM Plex Mono', monospace; }
  .expense-amount { font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 15px; white-space: nowrap; }
  .del-x { background: none; border: none; color: #A63D2F; font-size: 16px; cursor: pointer; line-height: 1; padding: 2px 4px; opacity: 0.55; }
  .balance-card { display: flex; align-items: center; justify-content: space-between; background: #FFFDF7; border: 1px solid #E6DFCB; border-radius: 6px; padding: 13px 14px; margin-bottom: 10px; }
  .avatar { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #F7F3E8; font-weight: 600; font-size: 13px; font-family: 'Fraunces', serif; flex-shrink: 0; }
  .who { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 14.5px; }
  .bal-amt { font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 14.5px; }
  .pos { color: #212121; } .neg { color: #A63D2F; } .zero { color: #9A9280; }
  .receipt { background: #FFFDF7; border: 1px dashed #B7AD91; border-radius: 4px; padding: 14px 16px; margin-top: 4px; }
  .settle-row { display: flex; align-items: center; gap: 8px; font-family: 'IBM Plex Mono', monospace; font-size: 13.5px; padding: 8px 0; border-bottom: 1px dashed #E6DFCB; }
  .settle-row:last-child { border-bottom: none; }
  .arrow { color: #E0E0E0; font-weight: 600; }
  .settle-amt { margin-left: auto; font-weight: 600; }
  .empty { text-align: center; color: #9A9280; font-size: 13px; padding: 30px 10px; font-style: italic; }
  .tabbar { position: fixed; bottom: 0; left: 0; right: 0; max-width: 480px; margin: 0 auto; background: #121212; display: flex; padding: 10px 8px calc(10px + env(safe-area-inset-bottom)); }
  .tab-btn { flex: 1; background: none; border: none; cursor: pointer; padding: 8px 4px; color: #8FA69C; font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 1px; text-transform: uppercase; border-bottom: 2px solid transparent; }
  .tab-btn.active { color: #F7F3E8; border-bottom-color: #E0E0E0; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(27,36,32,0.55); display: flex; align-items: flex-end; z-index: 10; }
  .modal-overlay.center { align-items: center; padding: 20px; }
  .modal { background: #F7F3E8; width: 100%; max-width: 480px; margin: 0 auto; border-radius: 20px 20px 0 0; padding: 20px 20px calc(20px + env(safe-area-inset-bottom)); max-height: 88vh; overflow-y: auto; }
  .modal.card { border-radius: 16px; }
  .modal h3 { font-family: 'Fraunces', serif; margin: 0 0 8px; font-size: 20px; }
  .modal p.lead { font-size: 13.5px; color: #6B6355; margin: 0 0 18px; line-height: 1.5; }
  label.field { display: block; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: #6B6355; font-family: 'IBM Plex Mono', monospace; margin: 14px 0 6px; }
  input[type=text], input[type=number], select { width: 100%; padding: 10px 12px; border: 1px solid #D8CFB8; border-radius: 5px; background: #FFFDF7; font-family: 'Inter', sans-serif; font-size: 14.5px; color: #121212; }
  .chip-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
  .chip { padding: 7px 12px; border-radius: 16px; border: 1px solid #D8CFB8; background: #FFFDF7; font-size: 13px; cursor: pointer; font-weight: 500; }
  .chip.on { background: #212121; color: #F7F3E8; border-color: #212121; }
  .modal-actions { display: flex; gap: 10px; margin-top: 22px; }
  .btn-primary, .btn-ghost { flex: 1; padding: 12px; border-radius: 6px; font-weight: 600; font-size: 14px; cursor: pointer; border: none; font-family: 'Inter', sans-serif; }
  .btn-primary { background: #212121; color: #F7F3E8; }
  .btn-ghost { background: transparent; color: #6B6355; border: 1px solid #D8CFB8; }
  .friend-row { display: flex; align-items: center; justify-content: space-between; background: #FFFDF7; border: 1px solid #E6DFCB; border-radius: 6px; padding: 11px 13px; margin-bottom: 9px; }
  .add-friend-row { display: flex; gap: 8px; margin-bottom: 16px; }
  .add-friend-row input { flex: 1; }
  .code-display { font-family: 'IBM Plex Mono', monospace; font-size: 28px; font-weight: 600; letter-spacing: 4px; text-align: center; background: #FFFDF7; border: 1px dashed #B7AD91; border-radius: 6px; padding: 16px; margin: 14px 0; color: #212121; }
  .or-divider { text-align: center; color: #9A9280; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; font-family: 'IBM Plex Mono', monospace; margin: 20px 0; }
  .gate-btn { width: 100%; padding: 13px; border-radius: 6px; font-weight: 600; font-size: 14.5px; cursor: pointer; border: none; margin-bottom: 10px; }
  .gate-btn.primary { background: #212121; color: #F7F3E8; }
  .gate-btn.outline { background: transparent; border: 1px solid #D8CFB8; color: #121212; }
  .config-warning { background: #FCEFE9; border: 1px solid #E3B7A5; color: #7A3421; font-size: 12.5px; padding: 12px 14px; border-radius: 6px; margin-bottom: 16px; line-height: 1.5; }
  .config-warning code { background: rgba(0,0,0,0.06); padding: 1px 4px; border-radius: 3px; }
</style>
</head>
<body>
<div class="app">
  <div class="stamp-header">
    <div class="brand-row">
      <div>
        <p class="brand">uome</p>
        <div class="brand-sub" id="brandSub">expense tracker</div>
      </div>
      <button class="sync-pill" id="syncPill" onclick="openGroupInfo()">not synced</button>
    </div>
  </div>
  <div class="content" id="content"></div>
  <div class="tabbar">
    <button class="tab-btn" data-tab="ledger">Ledger</button>
    <button class="tab-btn" data-tab="balances">Balances</button>
    <button class="tab-btn" data-tab="friends">Friends</button>
  </div>
</div>
<div id="modalRoot"></div>
<div id="gateRoot"></div>

<script>
/* =========================================================
   FIREBASE CONFIG — fill this in with your own project's config
   (Firebase console → Project settings → your web app → Config)
   ========================================================= */
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_PROJECT.appspot.com",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID",
};
const CONFIG_IS_PLACEHOLDER = firebaseConfig.apiKey === "YOUR_API_KEY";

const LOCAL_GROUP_KEY = "ledgerco-group-id";
const PALETTE = ["#212121", "#E0E0E0", "#A63D2F", "#3D5A80", "#6B4226"];
const hashColor = (name) => {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = name.charCodeAt(i) + ((h << 5) - h);
  return PALETTE[Math.abs(h) % PALETTE.length];
};
const money = (n) => `£${Math.abs(n).toFixed(2)}`;
const uid = () => Math.random().toString(36).slice(2, 9);
const genGroupCode = () => Math.random().toString(36).slice(2, 8).toUpperCase();
function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }

let db = null;
let groupId = localStorage.getItem(LOCAL_GROUP_KEY) || null;
let unsubscribe = null;

let state = {
  friends: ["You"],
  expenses: [],
  tab: "ledger",
};

// ---------- Firestore wiring ----------
function initFirebase() {
  if (CONFIG_IS_PLACEHOLDER) return false;
  try {
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    db.enablePersistence({ synchronizeTabs: true }).catch(() => {});
    return true;
  } catch (e) {
    console.error("Firebase init failed", e);
    return false;
  }
}

function setSyncPill(mode) {
  const pill = document.getElementById("syncPill");
  if (mode === "live") { pill.textContent = groupId; pill.classList.add("live"); }
  else if (mode === "connecting") { pill.textContent = "connecting…"; pill.classList.remove("live"); }
  else { pill.textContent = "not synced"; pill.classList.remove("live"); }
}

function subscribeToGroup(id) {
  if (unsubscribe) unsubscribe();
  setSyncPill("connecting");
  unsubscribe = db.collection("groups").doc(id).onSnapshot((doc) => {
    if (doc.exists) {
      const data = doc.data();
      state.friends = data.friends || [];
      state.expenses = data.expenses || [];
    }
    setSyncPill("live");
    render();
  }, (err) => {
    console.error("Sync error", err);
    setSyncPill("not synced");
  });
}

async function pushState() {
  if (!db || !groupId) return;
  await db.collection("groups").doc(groupId).set({
    friends: state.friends,
    expenses: state.expenses,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
  }, { merge: true });
}

async function createGroup() {
  const id = genGroupCode();
  await db.collection("groups").doc(id).set({
    friends: ["You"],
    expenses: [],
    updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
  });
  groupId = id;
  localStorage.setItem(LOCAL_GROUP_KEY, id);
  subscribeToGroup(id);
  closeGate();
}

async function joinGroup(code) {
  const id = code.trim().toUpperCase();
  if (!id) return;
  const docRef = db.collection("groups").doc(id);
  const snap = await docRef.get();
  if (!snap.exists) {
    document.getElementById("joinError").textContent = "No group found with that code.";
    return;
  }
  groupId = id;
  localStorage.setItem(LOCAL_GROUP_KEY, id);
  subscribeToGroup(id);
  closeGate();
}

function leaveGroup() {
  if (unsubscribe) unsubscribe();
  groupId = null;
  localStorage.removeItem(LOCAL_GROUP_KEY);
  state = { friends: ["You"], expenses: [], tab: "ledger" };
  setSyncPill("not synced");
  render();
  showGate();
}

// ---------- Gate (join/create screen) ----------
function showGate() {
  if (CONFIG_IS_PLACEHOLDER) {
    document.getElementById("gateRoot").innerHTML = `
      <div class="modal-overlay center">
        <div class="modal card">
          <h3>Sync isn't set up yet</h3>
          <div class="config-warning">
            This copy of the app doesn't have a Firebase project connected, so it's running local-only on this device.
            Add your Firebase config in <code>index.html</code> (look for <code>firebaseConfig</code>) to enable sync across devices.
          </div>
          <div class="modal-actions">
            <button class="btn-primary" style="flex:1" onclick="closeGate()">Continue without sync</button>
          </div>
        </div>
      </div>`;
    return;
  }
  document.getElementById("gateRoot").innerHTML = `
    <div class="modal-overlay center">
      <div class="modal card">
        <h3>Sync with your friends</h3>
        <p class="lead">Create a group and share the code, or join a group someone already started.</p>
        <button class="gate-btn primary" onclick="createGroup()">Create a new group</button>
        <div class="or-divider">or</div>
        <input type="text" id="joinCodeInput" placeholder="Enter group code" style="text-transform:uppercase;text-align:center;letter-spacing:2px;font-family:'IBM Plex Mono',monospace;" />
        <div id="joinError" style="color:#A63D2F;font-size:12px;margin-top:6px;min-height:14px;"></div>
        <button class="gate-btn outline" style="margin-top:10px;" onclick="joinGroup(document.getElementById('joinCodeInput').value)">Join group</button>
      </div>
    </div>`;
}
function closeGate() { document.getElementById("gateRoot").innerHTML = ""; }

function openGroupInfo() {
  if (!groupId) { showGate(); return; }
  document.getElementById("modalRoot").innerHTML = `
    <div class="modal-overlay center" onclick="if(event.target===this) closeModal()">
      <div class="modal card">
        <h3>This group's code</h3>
        <p class="lead">Share this code with friends so their app syncs with yours in real time.</p>
        <div class="code-display">${esc(groupId)}</div>
        <div class="modal-actions">
          <button class="btn-ghost" onclick="leaveGroup(); closeModal();">Leave group</button>
          <button class="btn-primary" onclick="closeModal()">Done</button>
        </div>
      </div>
    </div>`;
}

// ---------- Business logic ----------
function computeBalances() {
  const bal = Object.fromEntries(state.friends.map((f) => [f, 0]));
  state.expenses.forEach((e) => {
    const share = e.amount / e.split.length;
    e.split.forEach((p) => { if (bal[p] !== undefined) bal[p] -= share; });
    if (bal[e.paidBy] !== undefined) bal[e.paidBy] += e.amount;
  });
  return bal;
}

function simplifyDebts(balances) {
  const creditors = [], debtors = [];
  Object.entries(balances).forEach(([name, amt]) => {
    if (amt > 0.01) creditors.push({ name, amt });
    else if (amt < -0.01) debtors.push({ name, amt: -amt });
  });
  creditors.sort((a, b) => b.amt - a.amt);
  debtors.sort((a, b) => b.amt - a.amt);
  const txns = [];
  let i = 0, j = 0;
  while (i < debtors.length && j < creditors.length) {
    const pay = Math.min(debtors[i].amt, creditors[j].amt);
    txns.push({ from: debtors[i].name, to: creditors[j].name, amount: pay });
    debtors[i].amt -= pay; creditors[j].amt -= pay;
    if (debtors[i].amt < 0.01) i++;
    if (creditors[j].amt < 0.01) j++;
  }
  return txns;
}

// ---------- Rendering ----------
function renderLedger() {
  const rows = state.expenses.map((e) => `
    <div class="expense-row">
      <div>
        <p class="expense-desc">${esc(e.desc)}</p>
        <div class="expense-meta">${esc(e.paidBy)} paid · split ${e.split.length} ways</div>
      </div>
      <div style="display:flex;align-items:center;gap:6px;">
        <span class="expense-amount">${money(e.amount)}</span>
        <button class="del-x" onclick="removeExpense('${e.id}')" aria-label="Delete expense">✕</button>
      </div>
    </div>`).join("");
  return `
    <div class="section-title">Expenses <button class="add-btn" onclick="openAddModal()">+ Add</button></div>
    ${state.expenses.length === 0 ? '<div class="empty">Nothing lost, nothing gained</div>' : rows}
  `;
}

function renderBalances() {
  const balances = computeBalances();
  const cards = state.friends.map((f) => {
    const b = balances[f] || 0;
    const cls = b > 0.01 ? "pos" : b < -0.01 ? "neg" : "zero";
    const label = b > 0.01 ? `is owed ${money(b)}` : b < -0.01 ? `owes ${money(b)}` : "settled up";
    return `
      <div class="balance-card">
        <div class="who"><div class="avatar" style="background:${hashColor(f)}">${esc(f.slice(0,2).toUpperCase())}</div>${esc(f)}</div>
        <div class="bal-amt ${cls}">${label}</div>
      </div>`;
  }).join("");
  const settlements = simplifyDebts(balances);
  const settleRows = settlements.map((t) => `
      <div class="settle-row">${esc(t.from)} <span class="arrow">→</span> ${esc(t.to)} <span class="settle-amt">${money(t.amount)}</span></div>
  `).join("");
  return `
    <div class="section-title">Balances</div>
    ${cards}
    <div class="section-title" style="margin-top:22px;">Settle up</div>
    <div class="receipt">${settlements.length === 0 ? "<div class=\"empty\">Everyone's even — nothing to settle.</div>" : settleRows}</div>
  `;
}

function renderFriends() {
  const rows = state.friends.map((f) => `
    <div class="friend-row">
      <div class="who"><div class="avatar" style="background:${hashColor(f)}">${esc(f.slice(0,2).toUpperCase())}</div>${esc(f)}</div>
      <button class="del-x" onclick="removeFriend('${esc(f)}')" aria-label="Remove friend">✕</button>
    </div>`).join("");
  return `
    <div class="section-title">Friends</div>
    <div class="add-friend-row">
      <input type="text" id="newFriendInput" placeholder="Add a friend's name" onkeydown="if(event.key==='Enter') addFriend()" />
      <button class="add-btn" onclick="addFriend()">Add</button>
    </div>
    ${rows}
  `;
}

function render() {
  document.getElementById("brandSub").textContent = `shared expenses · ${state.friends.length} friends`;
  const content = document.getElementById("content");
  if (state.tab === "ledger") content.innerHTML = renderLedger();
  else if (state.tab === "balances") content.innerHTML = renderBalances();
  else content.innerHTML = renderFriends();
  document.querySelectorAll(".tab-btn").forEach((btn) => btn.classList.toggle("active", btn.dataset.tab === state.tab));
}

document.querySelectorAll(".tab-btn").forEach((btn) => {
  btn.addEventListener("click", () => { state.tab = btn.dataset.tab; render(); });
});

// ---------- Mutations (write straight to Firestore; onSnapshot re-renders) ----------
function removeExpense(id) {
  state.expenses = state.expenses.filter((e) => e.id !== id);
  db ? pushState() : render();
}
function addFriend() {
  const input = document.getElementById("newFriendInput");
  const n = input.value.trim();
  if (!n || state.friends.includes(n)) return;
  state.friends.push(n);
  db ? pushState() : render();
}
function removeFriend(name) {
  state.friends = state.friends.filter((x) => x !== name);
  state.expenses = state.expenses.filter((e) => e.paidBy !== name && !e.split.includes(name));
  db ? pushState() : render();
}

let formState = { desc: "", amount: "", paidBy: "", split: [] };
function openAddModal() {
  formState = { desc: "", amount: "", paidBy: state.friends[0] || "", split: [...state.friends] };
  renderModal();
}
function closeModal() { document.getElementById("modalRoot").innerHTML = ""; }
function toggleSplit(name) {
  formState.split = formState.split.includes(name) ? formState.split.filter((n) => n !== name) : [...formState.split, name];
  renderModal(true);
}
function submitExpense() {
  const desc = document.getElementById("descInput").value.trim();
  const amount = parseFloat(document.getElementById("amountInput").value);
  const paidBy = document.getElementById("paidBySelect").value;
  if (!desc || !amount || amount <= 0 || formState.split.length === 0) return;
  state.expenses.unshift({ id: uid(), desc, amount, paidBy, split: formState.split });
  closeModal();
  db ? pushState() : render();
}
function renderModal(preserveInputs) {
  const desc = preserveInputs ? document.getElementById("descInput").value : formState.desc;
  const amount = preserveInputs ? document.getElementById("amountInput").value : formState.amount;
  const paidBy = preserveInputs ? document.getElementById("paidBySelect").value : formState.paidBy;
  const chips = state.friends.map((f) => `<button type="button" class="chip ${formState.split.includes(f) ? "on" : ""}" onclick="toggleSplit('${esc(f)}')">${esc(f)}</button>`).join("");
  const options = state.friends.map((f) => `<option value="${esc(f)}" ${f === paidBy ? "selected" : ""}>${esc(f)}</option>`).join("");
  document.getElementById("modalRoot").innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
      <div class="modal">
        <h3>New expense</h3>
        <label class="field">Description</label>
        <input type="text" id="descInput" placeholder="e.g. Dinner at the pub" value="${esc(desc)}" />
        <label class="field">Amount</label>
        <input type="number" id="amountInput" placeholder="0.00" value="${esc(amount)}" />
        <label class="field">Paid by</label>
        <select id="paidBySelect">${options}</select>
        <label class="field">Split among</label>
        <div class="chip-row">${chips}</div>
        <div class="modal-actions">
          <button class="btn-ghost" onclick="closeModal()">Cancel</button>
          <button class="btn-primary" onclick="submitExpense()">Save expense</button>
        </div>
      </div>
    </div>`;
}

// ---------- Boot ----------
render();
const hasFirebase = initFirebase();
if (hasFirebase && groupId) {
  subscribeToGroup(groupId);
