<!DOCTYPE html>
<html lang="en">
  <!-- TODO -->
  <!-- Add 'paid' button to settle up -->

<!-- HEADER -->
<head>
<!-- Use UTF-8 character encoding (standard) -->
<meta charset="UTF-8" />
<!-- Scale the size of the page according to screen size -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

<title>uome</title>
<!-- Declare this an installable PWA -->
<link rel="manifest" href="manifest.json" />
<!-- Set browser theme colour, i.e. the colour of the surrounding UI, not the web page itself -->
<meta name="theme-color" content="#121212" />
<!-- Declare icons -->
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />

<!-- Configure iOS home screen icon behaviour -->
<!-- Run in full-screen standalone -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<!-- Configure status bar behaviour (the black status bar at the top of the screen) -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<!-- Set the name of the app on the home screen -->
<meta name="apple-mobile-web-app-title" content="uome" />
<!-- General, non-iOS behaviour -->
<meta name="mobile-web-app-capable" content="yes" />

<!-- Load fancy font families (Fraunces, IBM Plex Mono, and Inter) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;0,700;1,500&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<!-- Define the document style with classes. This controls e.g. backgrounds and allows for defining of custom objects. -->
<link rel="stylesheet" href="style.css" />
</head>

<body>
<!-- Place an app box -->
<div class="app">
    <!-- Add header with branding and sync status -->
    <div class="stamp-header">
        <div class="brand-row">
            <!-- branding -->
            <div>
            <p class="brand">uome</p>
            <div class="brand-sub" id="brandSub">shared transactions</div>
            </div>
            <!-- sync status -->
            <button class="sync-pill" id ="syncPill" onclick="openGroupInfo()">not synced</button>
        </div>
    </div>
    <!-- Content -->
    <div class="content" id="content"></div>
    <!-- Tab bars -->
    <div class="tabbar">
        <button class="tab-btn" data-tab="transactions">Transactions</button>
        <button class="tab-btn" data-tab="balances">Balances</button>
        <button class="tab-btn" data-tab="friends">Friends</button>
    </div>
</div>
<!-- Create a modal and welcome gate for scripts to latch onto -->
<div id="modalRoot"></div>
<div id="gateRoot"></div>

<!-- JavaScript: The real engine of the web app -->
<script>
/* =========================================================
   FIREBASE CONFIG :
   (Firebase console → Project settings → your web app → Config)
   ========================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyBQdz0hZef0ZGdXv1odP_Ok4jLWuNTqHjk",
  authDomain: "uomi-e5b53.firebaseapp.com",
  projectId: "uomi-e5b53",
  storageBucket: "uomi-e5b53.firebasestorage.app",
  messagingSenderId: "322746050646",
  appId: "1:322746050646:web:ed23d246982e7e1286f3f7",
};
const CONFIG_IS_PLACEHOLDER = firebaseConfig.apiKey === "YOUR_API_KEY";

// Initialise group ID
const LOCAL_GROUP_KEY = "uome-group-id";
// Colour palette for avatar backgrounds
// Black, light grey, red, blue, brown 
const PALETTE = ["#212121", "#E0E0E0", "#A63D2F", "#3D5A80", "#6B4226"];
// Convert a name into a colour based on character values (pseudo-random)
const hashColour = (name) => {
    let h = 0;
    for (let i = 0; i < name.length; i++) {
        h = name.charCodeAt(i) + ((h << 5) - h); // ((h << 5) - h ) = h*31
    }
    return PALETTE[Math.abs(h) % PALETTE.length];
};
// Round and format a number n as currency (postive definite)
const money = (n) => `£${Math.abs(n).toFixed(2)}`;
// Generate pseudo-random user ID
const uid = () => Math.random().toString(36).slice(2,9);
// Generate a pseudo-random group code
const genGroupCode = () => Math.random().toString(36).slice(2,8).toUpperCase();
// HTML-escaping on input strings
function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }

// Initialise database, grab group ID from locals, unsubscription from Firebase
let db = null;
let groupId = localStorage.getItem(LOCAL_GROUP_KEY) || null;
let unsubscribe = null;

// Initial state
let state = {
    friends: ["John"],
    transactions: [],
    tab: "transactions",
}

let currencies = {
    name: ["GBP", "EUR"]
}

// --- FIREBASE CONNECTORS --- //
function initFirebase() {
    // Fail initialisation if config not setup
    if (CONFIG_IS_PLACEHOLDER) return false;
    try {
        firebase.initializeApp(firebaseConfig);
        db = firebase.firestore();
        db.enablePersistence({ synchronizeTabs: true }).catch(() => {});
        return true;
    } catch (e) {
        console.error("Firebase init failed! Caught:", e);
        return false;
    }
}

// Update sync pill
function setSyncPill(mode) {
    const pill = document.getElementById("syncPill");
    if (mode === "live") { pill.textContent = groupId; pill.classList.add("live"); }
    else if (mode === "connecting") { pill.textContent = "connecting…"; pill.classList.remove("live")}
    else { pill.textContent = "not synced"; pill.classList.remove("live"); }
}

// Subscribe to a group by ID
function subscribeToGroup(id) {
    // Detach any old listeners
    if (unsubscribe) unsubscribe();
    setSyncPill("connecting");
    // Grab data from Firebase database @ group ID
    unsubscribe = db.collection("groups").doc(id).onSnapshot((doc) => {
        if (doc.exists) {
            const data = doc.data();
            state.friends = data.friends || [];
            state.transactions = data.transactions || [];
        }
        setSyncPill("live");
        render();
    }, (err) => {
        console.error("Sync error! Caught", err);
        setSyncPill("not synced");
    })
}

// Push local changes to Firebase
async function pushState() {
    if (!db || !groupId) return;
    await db.collection("groups").doc(groupId).set({
        friends: state.friends,
        transactions: state.transactions,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
    }, { merge: true });
}

// Create a group with default field values
// Makes group ID persistent and closes welcome message/gate
async function createGroup() {
    const id = genGroupCode();
    await db.collection("groups").doc(id).set({
        friends: ["John"],
        transactions: [],
        updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
    });
    groupId = id;
    localStorage.setItem(LOCAL_GROUP_KEY, id);
    subscribeToGroup(id);
    closeGate();
}

// Join an existing group
async function joinGroup(code) {
    const id = code.trim().toUpperCase();
    if (!id) return;
    const docRef = db.collection("groups").doc(id);
    const snap = await docRef.get();
    if (!snap.exists) {
        document.getElementById("joinError").textContent = "Group not found.";
        return;
    }
    groupId = id;
    localStorage.setItem(LOCAL_GROUP_KEY, id);
    // Grab app data from group
    subscribeToGroup(id);
    closeGate();
}

// Leave active group
function leaveGroup() {
    if (unsubscribe) unsubscribe();
    groupId = null;
    localStorage.removeItem(LOCAL_GROUP_KEY);
    state = { friends: ["John"], transactions: [], tab: "transactions"};
    setSyncPill("not synced");
    render();
    showGate();
}

// --- GATE HANDLING (WELCOME SCREEN) --- //
function showGate() {
    // Hook onto the gateRoot element and insert a modal box with 
    // group code input
    if (CONFIG_IS_PLACEHOLDER) {
    document.getElementById("gateRoot").innerHTML = `
      <div class="modal-overlay center">
        <div class="modal card">
          <h3>Sync isn't set up yet</h3>
          <div class="config-warning">
            This copy of the app doesn't have a Firebase project connected, so it's running local-only on this device.
            Add your Firebase config in <code>index.html</code> (look for <code>firebaseConfig</code>) to enable sync across devices.
          </div>
          <div class="modal-actions">
            <button class="btn-primary" style="flex:1" onclick="closeGate()">Continue without sync</button>
          </div>
        </div>
      </div>`;
    return;
    }
    document.getElementById("gateRoot").innerHTML = `
    <div class="modal-overlay center">
      <div class="modal card">
        <h3>Synchronise transactions</h3>
        <p class="lead">Create a group and share the code, or join an existing group.</p>
        <button class="gate-btn primary" onclick="createGroup()">Create a new group</button>
        <div class="or-divider">or</div>
        <input type="text" id="joinCodeInput" placeholder="Enter group code" style="text-transform:uppercase;text-align:center;letter-spacing:2px;font-family:'IBM Plex Mono',monospace;" />
        <div id="joinError" style="color:#A63D2F;font-size:12px;margin-top:6px;min-height:14px;"></div>
        <button class="gate-btn outline" style="margin-top:10px;" onclick="joinGroup(document.getElementById('joinCodeInput').value)">Join group</button>
      </div>
    </div>`;
}
function closeGate() { document.getElementById("gateRoot").innerHTML = ""; }

// Expand group code or leave current group
function openGroupInfo() {
  if (!groupId) { showGate(); return; }
  document.getElementById("modalRoot").innerHTML = `
    <div class="modal-overlay center" onclick="if(event.target===this) closeModal()">
      <div class="modal card">
        <h3>This group's code</h3>
        <p class="lead">Share this code with friends so their app syncs with yours in real time.</p>
        <div class="code-display">${esc(groupId)}</div>
        <div class="modal-actions">
          <button class="btn-ghost" onclick="leaveGroup(); closeModal();">Leave group</button>
          <button class="btn-primary" onclick="closeModal()">Done</button>
        </div>
      </div>
    </div>`;
}

// ---  ACCOUNTING --- //
// Grab currency conversion rate
async function getRate(from, to) {
  if (from === to) return 1;
  const res = await fetch(`https://api.frankfurter.dev/v2/rate/${from}/${to}`);
  const data = await res.json();
  console.log(data)
  return data.rate
}

function computeBalances() {
    // Initialise a lookup with friend name and balance
    const bal = Object.fromEntries(state.friends.map((f) => [f, 0]));
    // Loop through transactions
    state.transactions.forEach((e) => {
        // Calculate the share for each transactions, i.e. transaction / no. of sharers
        const share = e.amount / e.split.length;
        // Subtract the share from every sharers balance
        e.split.forEach((p) => {
            if (bal[p] !== undefined ) bal[p] -= share;
        });
        // Add the total transaction to the payer
        // The net effect is that they are owed everything but their own share
        if (bal[e.paidBy] !== undefined ) bal[e.paidBy] += e.amount;
    });
    return bal
}

// Organise friends by debtors and creditors, with balances
// Recommend settle up transactions
function simplifyDebts(balances) {
    const creditors = [], debtors = [];
    // Loop over (name, amt) pairs in balances lookup table
    Object.entries(balances).forEach(([name, amt]) => {
        if (amt > 0.01) creditors.push({ name, amt });
        else if (amt < -0.01) debtors.push({ name, amt: -amt});
    });
    // Sort in descending order
    creditors.sort((a, b) => b.amt - a.amt);
    debtors.sort((a, b) => b.amt - a.amt);
    const txns = [];
    let i = 0, j = 0;
    // Calculate individual settle up transactions
    while (i < debtors.length && j < creditors.length) {
        const pay = Math.min(debtors[i].amt, creditors[j].amt);
        txns.push({ from: debtors[i].name, to: creditors[j].name, amount: pay});
        debtors[i].amt -= pay; creditors[j].amt -= pay;
        if (debtors[i].amt < 0.01) i++;
        if (creditors[j].amt < 0.01) j++;
    }
    return txns;
}

// --- RENDERING --- //
// Render transactions as rows
function renderTransactions() {
    const rows = state.transactions.map((e) => `
        <div class="transaction-row">
        <div>
            <p class="transaction-desc">${esc(e.desc)}</p>
            <div class="transaction-meta">${esc(e.paidBy)} paid · split ${e.split.length} ways</div>
        </div>
        <div style="display:flex;align-items:center;gap:6px;">
            <span class="transaction-amount">${money(e.amount)}</span>
            <button class="del-x" onclick="removeTransaction('${e.id}')" aria-label="Delete transaction">✕</button>
        </div>
        </div>`).join("");
    return `
        <div class="section-title">Transactions <button class="add-btn" onclick="openAddModal()">+ Add</button></div>
        ${state.transactions.length === 0 ? '<div class="empty">No transactions yet.</div>' : rows}
    `;
}

// Render transactions and settle ups
function renderBalances() {
    const balances = computeBalances();
    const cards = state.friends.map((f) => {
        const b = balances[f] || 0;
        const cls = b > 0.01 ? "pos" : b < -0.01 ? "neg" : "zero";
        const label = b > 0.01 ? `is owed ${money(b)}` : b < -0.01 ? `owes ${money(b)}` : "settled up";
        return `
        <div class="balance-card">
            <div class="who"><div class="avatar" style="background:${hashColour(f)}">${esc(f.slice(0,2).toUpperCase())}</div>${esc(f)}</div>
            <div class="bal-amt ${cls}">${label}</div>
        </div>`;
    }).join("");
    const settlements = simplifyDebts(balances);
    const settleRows = settlements.map((t) => `
        <div class="settle-row">${esc(t.from)} <span class="arrow">→</span> ${esc(t.to)} <span class="settle-amt">${money(t.amount)}</span><button class="pay-btn" onclick="">Pay up!</button></div>
    `).join("");
    return `
        <div class="section-title">Balances</div>
        ${cards}
        <div class="section-title" style="margin-top:22px;">Settle up</div>
        <div class="receipt">${settlements.length === 0 ? "<div class=\"empty\">Everyone's even — nothing to settle.</div>" : settleRows}</div>
    `;
}

// Render friends
function renderFriends() {
    const rows = state.friends.map((f) => `
        <div class="friend-row">
        <div class="who"><div class="avatar" style="background:${hashColour(f)}">${esc(f.slice(0,2).toUpperCase())}</div>${esc(f)}</div>
        <button class="del-x" onclick="removeFriend('${esc(f)}')" aria-label="Remove friend">✕</button>
        </div>`).join("");
    return `
        <div class="section-title">Friends</div>
        <div class="add-friend-row">
        <input type="text" id="newFriendInput" placeholder="Add a friend's name" onkeydown="if(event.key==='Enter') addFriend()" />
        <button class="add-btn" onclick="addFriend()">Add</button>
        </div>
        ${rows}
    `;
}

// Render app content based on tab state
function render() {
    document.getElementById("brandSub").textContent = `shared transactions · ${state.friends.length} friends`;
    const content = document.getElementById("content");
    if (state.tab === "transactions") content.innerHTML = renderTransactions();
    else if (state.tab === "balances") content.innerHTML = renderBalances();
    else content.innerHTML = renderFriends();
    document.querySelectorAll(".tab-btn").forEach((btn) => btn.classList.toggle("active", btn.dataset.tab === state.tab));
}

// Listen for clicks to tab buttons and re-render content
document.querySelectorAll(".tab-btn").forEach((btn) => {
     btn.addEventListener("click", () => { state.tab = btn.dataset.tab; render(); });
});

// --- REWRITE FIRESTORE AND RE-RENDER --- //
function removeTransaction(id) {
    state.transactions = state.transactions.filter((e) => e.id !== id);
    db ? pushState() : render();
}

function addFriend() {
    const input = document.getElementById("newFriendInput");
    const n = input.value.trim();
    if (!n || state.friends.includes(n)) return;
    state.friends.push(n);
    db ? pushState() : render();
}
function removeFriend(name) {
    state.friends = state.friends.filter((x) => x !== name);
    state.transactions = state.transactions.filter((e) => e.paidBy !== name && !e.split.includes(name));
    db ? pushState() : render();
}

// Adding transactions
let formState = { desc: "", amount: "", paidBy: "", split: [], currency: "", rate: null };
async function openAddModal() {
    formState = { desc: "", amount: "", paidBy: state.friends[0] || "", split: [...state.friends], currency: "GBP", rate: null };
    renderModal();

    // fetch currency rates
    const currency = document.getElementById("currencySelect")?.value || "GBP";
    formState.rate = await getRate(currency, "GBP");
    renderModal(true);
}
async function updateCurrency() {
    const currency = document.getElementById("currencySelect").value;
    formState.currency = currency;
    formState.rate = null; // fetch whilst changing
    renderModal(true);

    try {
        formState.rate = await getRate(currency, "GBP")
    } catch (err) {
        console.error(err);
        formState.rate = "error";
    }
    renderModal(true);
}
function closeModal() { document.getElementById("modalRoot").innerHTML = ""; }
// Toggle splitters
function toggleSplit(name) {
    formState.split = formState.split.includes(name) ? formState.split.filter((n) => n !== name) : [...formState.split, name];
    renderModal(true);
}
// Get transaction input
function submitTransaction() {
    const desc = document.getElementById("descInput").value.trim();
    const amount = parseFloat(document.getElementById("amountInput").value);
    const currency = document.getElementById("currencySelect").value.trim();
    const paidBy = document.getElementById("paidBySelect").value;
    const rate = formState.rate;
    if (!desc || !amount || amount <= 0 || (formState.split.length === 0) || (!formState.rate)) return;
    gbp_amount = amount * formState.rate;
    state.transactions.unshift({ id: uid(), desc, amount: gbp_amount, paidBy, split: formState.split, currency, rate });
    closeModal();
    db ? pushState() : render();
}
function renderModal(preserveInputs) {
    const desc = preserveInputs ? document.getElementById("descInput").value : formState.desc;
    const amount = preserveInputs ? document.getElementById("amountInput").value : formState.amount;
    const currency = preserveInputs ? document.getElementById("currencySelect").value : formState.currency;
    const paidBy = preserveInputs ? document.getElementById("paidBySelect").value : formState.paidBy;
    const chips = state.friends.map((f) => `<button type="button" class="chip ${formState.split.includes(f) ? "on" : ""}" onclick="toggleSplit('${esc(f)}')">${esc(f)}</button>`).join("");
    const paidByOptions = state.friends.map((f) => `<option value="${esc(f)}" ${f === paidBy ? "selected" : ""}>${esc(f)}</option>`).join("");
    const currencyOptions = currencies.name.map((n) => `<option value="${esc(n)}" ${n === currency ? "selected" : ""}>${esc(n)}</option>`).join("");
    document.getElementById("modalRoot").innerHTML = `
        <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
        <div class="modal">
            <h3>New transaction</h3>
            <label class="field">Description</label>
            <input type="text" id="descInput" placeholder="e.g. Taxi home" value="${esc(desc)}" />
            <label class="field">Amount</label>
            <input type="number" id="amountInput" placeholder="0.00" value="${esc(amount)}" />
            <label class="field">Currency</label>
            <select id="currencySelect" onchange="updateCurrency()">${currencyOptions}</select>
            <label class="desc">Conversion rate: £${formState.rate ?? "fetching..."}</label>
            <label class="field">Paid by</label>
            <select id="paidBySelect">${paidByOptions}</select>
            <label class="field">Split among</label>
            <div class="chip-row">${chips}</div>
            <div class="modal-actions">
            <button class="btn-ghost" onclick="closeModal()">Cancel</button>
            <button class="btn-primary" onclick="submitTransaction()">Save transaction</button>
            </div>
        </div>
        </div>`;
}

// --- BOOT --- //
render();
const hasFirebase = initFirebase();
if (hasFirebase && groupId) {
    subscribeToGroup(groupId);
} else {
    showGate();
}

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
</body>
</html>
